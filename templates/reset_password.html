<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset Password - EggSort+</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link rel="stylesheet" href="/static/responsive.css" />
    <meta name="csrf-token" content="{{ csrf_token() }}" />
    <script src="{{ url_for('static', filename='security.js') }}" defer></script>
  </head>
  <body class="min-h-screen flex items-center justify-center bg-[#f2f0e7] p-4 font-sans">
    <main class="w-full max-w-md rounded-2xl bg-white p-8 shadow-xl">
      <p class="mb-3 text-sm font-extrabold uppercase tracking-[0.2em] text-[#4a7355]">EggSort+</p>
      <h1 class="mb-2 text-2xl font-extrabold text-[#28322b]">Set a new password</h1>
      {% if error %}<div class="mb-5 rounded-lg border-l-4 border-red-500 bg-red-50 p-3 text-sm text-red-800" role="alert">{{ error }}</div>{% endif %}
      {% if valid_token %}
      <p class="mb-6 text-sm text-[#6b746a]">Choose a password with at least 8 characters.</p>
      <form method="post" class="space-y-4">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}" />
        <div><label for="password" class="mb-2 block text-sm font-bold text-[#555d52]">NEW PASSWORD</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required class="w-full rounded-xl border border-[#dedccf] bg-[#faf9f4] px-4 py-3" /></div>
        <div><label for="password_confirmation" class="mb-2 block text-sm font-bold text-[#555d52]">CONFIRM PASSWORD</label><input id="password_confirmation" name="password_confirmation" type="password" autocomplete="new-password" minlength="8" maxlength="128" required class="w-full rounded-xl border border-[#dedccf] bg-[#faf9f4] px-4 py-3" /></div>
        <button type="submit" class="w-full rounded-xl bg-[#4a7355] px-4 py-3 font-bold text-white hover:bg-[#3e6248]">Update password</button>
      </form>
      {% else %}<a href="{{ url_for('forgot_password') }}" class="mt-3 block text-center text-sm font-semibold text-[#4a7355] hover:underline">Request a new reset link</a>{% endif %}
    </main>
  </body>
</html>
