<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forgot Password - EggSort+</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link rel="stylesheet" href="/static/responsive.css" />
    <meta name="csrf-token" content="{{ csrf_token() }}" />
    <script src="{{ url_for('static', filename='security.js') }}" defer></script>
  </head>
  <body class="min-h-screen flex items-center justify-center bg-[#f2f0e7] p-4 font-sans">
    <main class="w-full max-w-md rounded-2xl bg-white p-8 shadow-xl">
      <img src="{{ url_for('static', filename='images/eggsort.png') }}" alt="EGGSor+ logo" class="mb-3 w-48 aspect-[1.4/1] object-cover" />
      <h1 class="mb-2 text-2xl font-extrabold text-[#28322b]">Forgot your password?</h1>
      <p class="mb-6 text-sm text-[#6b746a]">Enter your account email and we’ll send a password reset link if it matches an active account.</p>
      {% if notice %}<div class="mb-5 rounded-lg border-l-4 border-green-500 bg-green-50 p-3 text-sm text-green-800" role="status">{{ notice }}</div>{% endif %}
      <form method="post" class="space-y-4">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}" />
        <label for="email" class="block text-sm font-bold text-[#555d52]">EMAIL</label>
        <input id="email" name="email" type="email" autocomplete="email" required class="w-full rounded-xl border border-[#dedccf] bg-[#faf9f4] px-4 py-3" />
        <button type="submit" class="w-full rounded-xl bg-[#4a7355] px-4 py-3 font-bold text-white hover:bg-[#3e6248]">Send reset link</button>
      </form>
      <a href="{{ url_for('login') }}" class="mt-5 block text-center text-sm font-semibold text-[#4a7355] hover:underline">Back to sign in</a>
    </main>
  </body>
</html>
